services:
  postgres:
    image: postgres:17-alpine
    container_name: tourist-report-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tourist
      POSTGRES_PASSWORD: tourist
      POSTGRES_DB: tourist_report
    ports:
      - '5432:5432'
    volumes:
      - tourist-report-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tourist -d tourist_report']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tourist-report-db:
